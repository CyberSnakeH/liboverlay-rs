[package]
name = "liboverlay-c"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Generic C/C++ drawing, widgets and desktop integration for liboverlay-rs"
publish = false

[lib]
name = "overlay_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
liboverlay-rs = { path = "..", features = ["egui"] }
serde_json = "1"
x11rb = { version = "0.13.2", features = ["randr"] }
rustix = { version = "1", features = ["net", "event"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
