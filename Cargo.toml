[package]
name = "liboverlay-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Capability-aware Linux overlays with CPU or optional Vulkan presentation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CyberSnakeH/liboverlay-rs"
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "ROADMAP.md", "src/**", "examples/**", "tests/**", "scripts/*.py", "docs/ARCHITECTURE.md", "docs/USAGE.md", "docs/TESTING.md"]
keywords = ["overlay", "wayland", "x11", "hud", "linux"]
categories = ["gui", "graphics"]

[lib]
name = "liboverlay"

[features]
default = ["wayland", "x11"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:memmap2"]
x11 = ["dep:x11rb"]
gpu = ["dep:wgpu", "dep:raw-window-handle", "dep:libloading", "wayland-client?/system", "wayland-client?/dlopen"]

[dependencies]
crossbeam-channel = "0.5"
thiserror = "2"
rustix = { version = "1", features = ["event", "pipe", "fs"] }
memmap2 = { version = "0.9", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.13.2", features = ["shape", "render", "randr", "present", "dri3"], optional = true }
wgpu = { version = "25.0.2", default-features = false, features = ["vulkan", "wgsl"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[[example]]
name = "gpu_hud"
required-features = ["gpu"]

[[example]]
name = "gpu_stability"
required-features = ["gpu", "wayland"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
